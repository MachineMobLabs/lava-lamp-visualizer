<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Magenta teardrop -->
  <defs>
    <linearGradient id="tearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd00dd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Teardrop shape pointing down -->
  <path d="M 32 8 C 44 8 52 16 52 28 C 52 40 32 56 32 56 C 32 56 12 40 12 28 C 12 16 20 8 32 8 Z"
        fill="url(#tearGradient)"
        stroke="#ff00ff"
        stroke-width="1"
        opacity="0.95"/>

  <!-- Subtle inner highlight -->
  <ellipse cx="28" cy="20" rx="6" ry="8" fill="white" opacity="0.3"/>
</svg>
